name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: System packages used by the add-on wiring tests
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends nginx-light rsync jq

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: TypeScript tests (unit + UI against the real Domovoy service)
        run: pnpm test

      - name: Python tests (add-on services, Domovoy, nginx wiring)
        run: pnpm test:python

      - name: Validate configs and build the demo
        run: pnpm validate:demo && pnpm build:demo

      - name: Rebuild the add-on seeds
        run: pnpm release:kiosk-addon

      - name: Committed seeds must match their sources
        run: |
          git add -N kiosk_scene/scene-runtime-seed kiosk_scene/extensions-seed
          if ! git diff --exit-code --stat -- kiosk_scene/scene-runtime-seed kiosk_scene/extensions-seed; then
            echo "::error::The committed add-on seeds are stale. Run 'pnpm release:kiosk-addon' and commit the result."
            exit 1
          fi

  docker-build:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and test add-on
        run: |
          # Extract version from config.yaml
          VERSION=$(grep -oP '(?<=version: ").*?(?=" )' kiosk_scene/config.yaml)
          echo "Version: $VERSION"
          # Prepare options.json
          mkdir -p .ci-data
          cat > .ci-data/options.json <<'EOF'
{
  "timezone": "Europe/Moscow",
  "active_pack_id": "neiri",
  "domovoy_enabled": true,
  "domovoy_kiosk_mic": false,
  "domovoy_kiosk_room": "",
  "domovoy_trusted_networks": []
}
EOF
          # Build image
          docker build --no-cache \
            --build-arg BUILD_VERSION="$VERSION" \
            --build-arg GIT_SHA=${{ github.sha }} \
            -t kiosk-scene-ci ./kiosk_scene
          # Runtime file checks
          docker run --rm kiosk-scene-ci grep -q "Открыть администрирование" /opt/kiosk-scene/www/index.html
          docker run --rm kiosk-scene-ci test -f /opt/kiosk-scene/scene-runtime-seed/admin.html
          docker run --rm kiosk-scene-ci test -f /opt/kiosk-scene/extensions-seed/domovoy/domovoy.js
          docker run --rm kiosk-scene-ci cat /etc/kiosk_scene_version.txt
          # Start container with options volume and expose nginx port 48123
          CONTAINER_ID=$(docker run -d \
            -p 48123:48123 \
            -v "$PWD/.ci-data:/data:ro" \
            kiosk-scene-ci)
          # Ensure container is cleaned up on exit
          cleanup() {
            docker rm -f "$CONTAINER_ID" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          # Wait for add-on to become ready (max 30 seconds)
          TIMEOUT=30
          ELAPSED=0
          while ! curl -fsS http://localhost:48123/health >/dev/null 2>&1; do
            sleep 1
            ELAPSED=$((ELAPSED+1))
            if [ $ELAPSED -ge $TIMEOUT ]; then
              echo "Error: Timeout waiting for add-on to become ready"
              cleanup
              exit 1
            fi
          done
          # HTTP integrity checks via nginx
          echo "Checking /health endpoint..."
          curl -fsS http://localhost:48123/health | jq -e '.status == "ok" and .version | test("Kiosk Scene version")'
          echo "Checking /admin/ endpoint..."
          curl -fsS http://localhost:48123/admin/ -L | grep -q "KioskScene"
          echo "Checking /scene-api/bootstrap endpoint..."
          curl -fsS http://localhost:48123/scene-api/bootstrap | jq -e '.success == true'
          echo "Checking /domovoy-api/api/state endpoint..."
          curl -fsS http://localhost:48123/domovoy-api/api/state | jq -e '.'

