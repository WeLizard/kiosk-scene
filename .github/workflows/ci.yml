name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: System packages used by the add-on wiring tests
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends nginx-light rsync jq

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: TypeScript tests (unit + UI against the real Domovoy service)
        run: pnpm test

      - name: Python tests (add-on services, Domovoy, nginx wiring)
        run: pnpm test:python

      - name: Validate configs and build the demo
        run: pnpm validate:demo && pnpm build:demo

      - name: Rebuild the add-on seeds
        run: pnpm release:kiosk-addon

      - name: Committed seeds must match their sources
        run: |
          git add -N kiosk_scene/scene-runtime-seed kiosk_scene/extensions-seed
          if ! git diff --exit-code --stat -- kiosk_scene/scene-runtime-seed kiosk_scene/extensions-seed; then
            echo "::error::The committed add-on seeds are stale. Run 'pnpm release:kiosk-addon' and commit the result."
            exit 1
          fi

  docker-build:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and test add-on
        run: |
          docker build --no-cache \
            --build-arg BUILD_VERSION=${{ github.ref_name }} \
            --build-arg GIT_SHA=${{ github.sha }} \
            -t kiosk-scene-ci ./kiosk_scene
          # Runtime file checks
          docker run --rm kiosk-scene-ci grep -q "Открыть администрирование" /opt/kiosk-scene/www/index.html
          docker run --rm kiosk-scene-ci test -f /opt/kiosk-scene/scene-runtime-seed/admin.html
          docker run --rm kiosk-scene-ci test -f /opt/kiosk-scene/extensions-seed/domovoy/domovoy.js
          docker run --rm kiosk-scene-ci cat /etc/kiosk_scene_version.txt
          # Start container in background for HTTP checks (assumes host has curl and jq)
          CONTAINER_ID=$(docker run -d -p 48097:48097 kiosk-scene-ci)
          sleep 5
          curl -s http://localhost:48097/health | jq -e '.version'
          curl -s http://localhost:48097/admin/ | grep -q "Открыть администрирование"
          curl -s http://localhost:48097/scene-api/bootstrap | jq -e '.'
          docker stop $CONTAINER_ID
