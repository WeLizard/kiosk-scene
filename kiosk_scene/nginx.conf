worker_processes 1;

error_log /dev/stderr notice;

events { worker_connections 1024; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  access_log /dev/stdout;
  error_log /dev/stderr notice;

  sendfile on;
  keepalive_timeout 65;
  client_max_body_size 256m;

  # Who is calling the Domovoy API. Generated by run.sh: HA ingress and this machine are trusted, LAN clients are
  # trusted only when listed in the add-on option `domovoy_trusted_networks` (e.g. the kiosk); anyone else needs
  # the API token. The value is always *overwritten* below, so a client cannot claim to be trusted.
  include /etc/nginx/domovoy-origin.conf;

  # Scene pack administration is available through authenticated HA ingress or
  # from the local host. Overwrite this header so LAN callers cannot assert it.
  map $remote_addr $scene_admin {
    default 0;
    127.0.0.1 1;
    172.30.32.2 1;
  }

  server {
    listen 48123;

    # Private pack/avatar files: ingress, trusted kiosk networks, and the add-on host itself (even when it
    # reaches its own LAN address) may read them; other LAN clients may not.
    set $scene_asset_allowed 0;
    if ($domovoy_origin != "lan") { set $scene_asset_allowed 1; }
    if ($remote_addr = $server_addr) { set $scene_asset_allowed 1; }

    location = /health {
      proxy_pass http://127.0.0.1:48097/health;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /scene-editor {
      return 302 scene-editor/;
    }

    location = /scene-editor/ {
      add_header Cache-Control "no-store" always;
      return 302 ../scene-runtime/?editor=1&v=$msec;
    }

    location ^~ /scene-editor-form/ {
      proxy_pass http://127.0.0.1:48098;
      proxy_http_version 1.1;
      proxy_set_header X-Scene-Admin $scene_admin;
      proxy_set_header X-Scene-Client $http_x_scene_client;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
    }

    location = /admin {
      return 302 admin/;
    }

    location = /admin/ {
      add_header Cache-Control "no-store" always;
      return 302 ../scene-runtime/admin.html?v=$msec;
    }

    location = /scene {
      return 302 scene/;
    }

    location = /scene/ {
      add_header Cache-Control "no-store" always;
      return 302 ../scene-runtime/?v=$msec;
    }

    location ^~ /scene-api/ {
      proxy_pass http://127.0.0.1:48097;
      proxy_http_version 1.1;
      proxy_request_buffering off;
      proxy_set_header X-Scene-Admin $scene_admin;
      proxy_set_header X-Scene-Client $http_x_scene_client;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
    }

    # Domovoy household assistant (optional add-on service on 127.0.0.1:48199)
    location ^~ /domovoy-api/ {
      proxy_pass http://127.0.0.1:48199/;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Domovoy-Origin $domovoy_origin;
      proxy_buffering off;
      proxy_request_buffering on;
      client_max_body_size 9m;
      # Domovoy keeps its own (redacted) log: the request line of the Alice webhook contains its secret.
      access_log off;
      # /events is a long poll (up to 30 s); audio is transcribed synchronously
      proxy_read_timeout 90s;
      proxy_send_timeout 60s;
      add_header Cache-Control "no-store" always;
    }

    # Frontend extensions (`<id>/extension.json` + module) found by scene_host_service
    location ^~ /scene-extensions/ {
      add_header Cache-Control "no-cache" always;
      alias /config/kiosk-scene/extensions/;
      try_files $uri =404;
    }

    location ^~ /scene-runtime/ {
      add_header Cache-Control "no-store" always;
      root /opt/kiosk-scene;
      index index.html;
      try_files $uri $uri/ /scene-runtime/index.html;
    }

    location ^~ /scene-legacy/live2d/ {
      if ($scene_asset_allowed = 0) { return 403; }
      add_header Cache-Control "no-store" always;
      alias /config/www/live2d/;
    }

    location ^~ /scene-packs/ {
      if ($scene_asset_allowed = 0) { return 403; }
      root /config/kiosk-scene;
      try_files $uri =404;
    }

    location ^~ /avatar-packs/ {
      if ($scene_asset_allowed = 0) { return 403; }
      root /config/kiosk-scene;
      try_files $uri =404;
    }

    location = / {
      root /opt/kiosk-scene/www;
      default_type text/html;
      try_files /index.html =404;
    }

    location / {
      return 404;
    }
  }
}
