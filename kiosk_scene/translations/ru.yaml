configuration:
  timezone:
    name: Часовой пояс
    description: Часовой пояс IANA для сцены и Домового (например, Europe/Moscow).
  active_pack_id:
    name: Активный пакет сцены
    description: Пакет сцены, который показывается по умолчанию.
  domovoy_enabled:
    name: Включить Домового
    description: Запускает домашнего ассистента Домовой (вещи, память, напоминания, календарь) и его панель.
  domovoy_kiosk_mic:
    name: Микрофон киоска
    description: Киоск слушает «Домовой …» через свой микрофон. Нужен HTTPS или localhost и сервер распознавания речи (страница «Интеграции»).
  domovoy_kiosk_room:
    name: Комната киоска
    description: Название комнаты, где стоит киоск (например, «кухня»), чтобы ответ звучал в ближайшей колонке.
  domovoy_trusted_networks:
    name: Доверенные адреса в сети
    description: Устройства или подсети (например, 192.168.1.40 или 192.168.1.0/24), которым можно работать с Домовым без токена — обычно это киоск. Панели Home Assistant токен не нужен никогда.
